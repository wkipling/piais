[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piais"
version = "0.1.0"
description = "AIS from RTL-SDR to NMEA 2000 on a RAM-resident Raspberry Pi Zero 2 W"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wkipling" }]
dependencies = [
  "pyais>=3.3,<4",
  "nmea2000>=2025.10,<2027",
  "python-can>=4.4,<5",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
piais-aisd = "piais.service:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
